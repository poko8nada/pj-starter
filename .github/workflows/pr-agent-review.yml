name: PR Agent Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # mainのTomlを変更せず、モデル順とレビュー形式をWorkflowで検証する
      - name: Capture existing review comments
        id: capture_comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_ids="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&sort=created&direction=desc" \
              --jq '[.[] | select(.user.login == "github-actions" or .user.login == "github-actions[bot]") | .id]' |
              tr -d '\n'
          )"
          echo "ids=${comment_ids}" >> "$GITHUB_OUTPUT"

      - name: Run PR Agent
        id: pragent
        uses: docker://pragent/pr-agent@sha256:3121a7b8e3ab497b4df09dea6a444da8f01a474496c8c2f722828512c52fd266
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: 'openrouter/z-ai/glm-4.7-flash'
          CONFIG__FALLBACK_MODELS: '["openrouter/deepseek/deepseek-v4-flash-0731", "openrouter/qwen/qwen3-coder-next", "openrouter/openai/gpt-5.6-luna"]'
          CONFIG__AI_TIMEOUT: '60'
          CONFIG__MAX_MODEL_TOKENS: '32000'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG__REASONING_EFFORT: 'low'
          OPENROUTER__REASONING_EFFORT: 'low'
          CONFIG__PUBLISH_OUTPUT_PROGRESS: 'false'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: 'true'
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER__PERSISTENT_COMMENT: 'false'
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: 'false'
          PR_REVIEWER__ENABLE_INTRO_TEXT: 'false'
          PR_REVIEWER__ENABLE_HELP_TEXT: 'false'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_ESTIMATE_CONTRIBUTION_TIME_COST: 'false'
          PR_REVIEWER__NUM_MAX_FINDINGS: '3'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: |
            必ず日本語で回答してください。
            PR-Agentの標準YAML出力形式を維持し、Markdown見出しやJSONを直接出力しないでください。
            指摘がある場合は、issue_headerとissue_contentに問題・根拠・修正案を日本語で簡潔に含めてください。
            指摘がない場合は、key_issues_to_reviewをNoにしてください。
            推測や好みではなく、今回の変更による具体的な問題だけを指摘してください。

      - name: Add deterministic review verdict
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_COMMENT_IDS: ${{ steps.capture_comments.outputs.ids }}
          PR_AGENT_REVIEW_JSON: ${{ steps.pragent.outputs.review }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_AGENT_REVIEW_JSON}" ]]; then
            echo "::warning::PR-Agent did not expose structured review output; keeping the standard comment."
            exit 0
          fi

          if ! verdict="$(
            jq -r '
              def is_no:
                . == null or
                . == false or
                . == "" or
                (type == "string" and
                  ((ascii_downcase == "no") or
                   (ascii_downcase == "none") or
                   (ascii_downcase == "false"))) or
                (type == "array" and length == 0);

              if (has("key_issues_to_review") | not) then
                "UNKNOWN"
              elif (.key_issues_to_review | is_no) then
                "✅ 指摘なし"
              elif (.key_issues_to_review | type) == "array" then
                "⚠️ 指摘あり"
              else
                "UNKNOWN"
              end
            ' <<< "${PR_AGENT_REVIEW_JSON}"
          )"; then
            echo "::warning::PR-Agent returned invalid structured review output; keeping the standard comment."
            exit 0
          fi

          if [[ "${verdict}" == "UNKNOWN" ]]; then
            echo "::warning::PR-Agent returned an unknown review shape; keeping the standard comment."
            exit 0
          fi

          comments_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&sort=created&direction=desc"
          )"
          comment_id="$(
            jq -r --argjson before "${BEFORE_COMMENT_IDS:-[]}" '
              [
                .[]
                | select(.user.login == "github-actions" or .user.login == "github-actions[bot]")
                | select(.id as $id | (($before | index($id)) == null))
              ]
              | .[0].id // empty
            ' <<< "${comments_json}"
          )"

          if [[ -z "${comment_id}" ]]; then
            echo "::warning::No new PR-Agent comment was found; keeping the standard comment."
            exit 0
          fi

          existing_body="$(
            jq -r --argjson id "${comment_id}" \
              '.[] | select(.id == $id) | .body' <<< "${comments_json}"
          )"

          if [[ "${existing_body}" == "## 判定"* ]]; then
            echo "Review verdict is already present."
            exit 0
          fi

          updated_body="$(
            printf '## 判定\n%s\n\n---\n\n%s\n' "${verdict}" "${existing_body}"
          )"
          jq -n --arg body "${updated_body}" '{body: $body}' |
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input -
